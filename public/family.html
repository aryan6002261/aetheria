<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Family Household & Lineage</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 960px;">
    <!-- Household Hero Card -->
    <div class="cyber-card p-4 p-md-5 mb-4 position-relative">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge badge-neon-emerald tech-font">VERIFIED CIVILIAN HOUSEHOLD</span>
        <span class="pulse-beacon"></span>
      </div>

      <h2 class="display-6 brand-font text-white mb-1" id="family-name">Household Lineage</h2>
      <p class="text-info fst-italic tech-font mb-4" id="family-motto">"Per Aspera Ad Astra"</p>

      <div class="row g-3 border-top border-secondary pt-3 mb-3">
        <div class="col-6 col-sm-4">
          <div class="text-muted small tech-font text-uppercase">Wealth Classification</div>
          <div class="fs-5 text-white fw-bold tech-font" id="family-wealth">Middle Class</div>
        </div>
        <div class="col-6 col-sm-4">
          <div class="text-muted small tech-font text-uppercase">Child Adoption Consent</div>
          <div class="fs-5 text-info fw-bold tech-font" id="family-consent">Not Accepting</div>
        </div>
        <div class="col-12 col-sm-4">
          <div class="text-muted small tech-font text-uppercase">My Household Role</div>
          <div class="fs-5 text-success fw-bold tech-font" id="family-my-role">Citizen Member</div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-cyber-primary btn-sm" data-bs-toggle="modal" data-bs-target="#householdSettingsModal">
          <i class="bi bi-gear-fill me-1"></i> Household Settings & Adoption Consent
        </button>
        <button class="btn btn-cyber-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#transferInheritanceModal">
          <i class="bi bi-gift-fill me-1"></i> Transfer Property / Inheritance
        </button>
      </div>
    </div>

    <!-- Family Members Grid -->
    <h4 class="brand-font text-white fs-5 mb-3"><i class="bi bi-people-fill text-info me-2"></i>Lineage Roster</h4>
    <div class="row g-4" id="family-members-grid">
      <div class="col-12 text-center text-muted py-4">Reading lineage archives...</div>
    </div>
  </div>

  <!-- Household Settings Modal -->
  <div class="modal fade" id="householdSettingsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content cyber-card border-secondary text-white">
        <div class="modal-header border-secondary py-3">
          <h5 class="modal-title brand-font fs-6">Household Consent & Settings</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="household-settings-form" onsubmit="handleSaveHouseholdSettings(event)">
          <div class="modal-body p-4">
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="accepting-children-switch">
              <label class="form-check-label text-white small" for="accepting-children-switch">
                Explicit Consent: Accept newly arriving children into household
              </label>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Family Motto</label>
              <input type="text" id="household-motto-input" class="form-control form-control-cyber" placeholder="Per Aspera Ad Astra">
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-cyber-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-cyber-primary btn-sm">Save Household Policy</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Transfer Inheritance Modal -->
  <div class="modal fade" id="transferInheritanceModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content cyber-card border-secondary text-white">
        <div class="modal-header border-secondary py-3">
          <h5 class="modal-title brand-font fs-6">Transfer Family Property & Inheritance</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="inheritance-form" onsubmit="handleTransferInheritance(event)">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Select Family Member</label>
              <select id="inheritance-target" class="form-select form-select-cyber" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Inheritance Amount (₡)</label>
              <input type="number" id="inheritance-amount" class="form-control form-control-cyber" placeholder="100.00" step="0.01" min="0.01" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Transfer Testament / Note</label>
              <input type="text" id="inheritance-note" class="form-control form-control-cyber" placeholder="Family generational bequest">
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-cyber-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-cyber-primary btn-sm">Execute Transfer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let myFamilyData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('family');
      loadFamilyData();
    });

    async function loadFamilyData() {
      try {
        const data = await apiFetch('/api/family/my-family');
        myFamilyData = data;
        const fam = data.family;
        const members = data.members || [];

        if (fam) {
          document.getElementById('family-name').innerText = fam.family_name;
          document.getElementById('family-motto').innerText = `"${fam.motto || 'Per Aspera Ad Astra'}"`;
          document.getElementById('family-wealth').innerText = fam.wealth_tier || 'Middle Class';
          document.getElementById('family-consent').innerText = fam.accepting_children ? 'Consent Active (Accepting)' : 'Not Accepting';
          document.getElementById('family-my-role').innerText = fam.my_role || 'Citizen Member';
          document.getElementById('accepting-children-switch').checked = !!fam.accepting_children;
          document.getElementById('household-motto-input').value = fam.motto || '';
        }

        const grid = document.getElementById('family-members-grid');
        grid.innerHTML = members.map(m => `
          <div class="col-md-6 col-lg-4">
            <div class="cyber-card p-4 h-100 text-center">
              <div class="rounded-circle border border-info p-2 mx-auto mb-3" style="width: 72px; height: 72px; background: #0b1329;">
                <img src="${m.sprite_url || '/img/avatars/default.png'}" alt="Member" class="w-100 h-100 rounded-circle" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${m.username}'">
              </div>
              <h5 class="brand-font text-white fs-6 mb-1">${m.character_name}</h5>
              <div class="text-info tech-font small mb-2">@${m.username}</div>
              <div class="badge badge-neon-cyan tech-font mb-2">${m.role}</div>
              <div class="text-muted small">Age ${m.virtual_age} (${m.life_stage})</div>
            </div>
          </div>
        `).join('');

        // Populate Inheritance target dropdown
        const select = document.getElementById('inheritance-target');
        select.innerHTML = members
          .filter(m => m.profile_id !== (window.myProfile?.id))
          .map(m => `<option value="${m.profile_id}">${m.character_name} (${m.role})</option>`)
          .join('');
      } catch (err) {
        showToast('Failed to load family data: ' + err.message, 'danger');
      }
    }

    async function handleSaveHouseholdSettings(e) {
      e.preventDefault();
      const acceptingChildren = document.getElementById('accepting-children-switch').checked;
      const motto = document.getElementById('household-motto-input').value.trim();

      try {
        const res = await apiFetch('/api/family/settings', {
          method: 'POST',
          body: { acceptingChildren, motto }
        });
        showToast(res.message, 'success');
        bootstrap.Modal.getInstance(document.getElementById('householdSettingsModal')).hide();
        loadFamilyData();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function handleTransferInheritance(e) {
      e.preventDefault();
      const targetProfileId = document.getElementById('inheritance-target').value;
      const amount = document.getElementById('inheritance-amount').value;
      const note = document.getElementById('inheritance-note').value.trim();

      try {
        const res = await apiFetch('/api/family/transfer-property', {
          method: 'POST',
          body: { targetProfileId, amount, note }
        });
        showToast(res.message, 'success');
        bootstrap.Modal.getInstance(document.getElementById('transferInheritanceModal')).hide();
        renderCyberNavbar('family');
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
