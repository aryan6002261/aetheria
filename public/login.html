<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Terminal Authentication</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Google Sign-In Client Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-4">

  <div class="container" style="max-width: 520px;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="text-info fs-1 mb-2"><i class="bi bi-disc"></i></div>
      <h2 class="brand-font text-white text-uppercase" style="letter-spacing: 2px;">AETHERIA</h2>
      <div class="tech-font text-info text-uppercase small" style="letter-spacing: 1.5px;">Civilian Authentication Gateway</div>
    </div>

    <!-- Login Card -->
    <div class="cyber-card p-4 p-md-5 mb-4">
      <h4 class="brand-font text-white mb-2 fs-5">Identify Citizen</h4>
      <p class="text-muted small mb-4">Authenticate using your verified Google Identity or launch an active testing session.</p>

      <!-- Google OAuth 2.0 Sign-In Button Container -->
      <div class="text-center mb-4">
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleGoogleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin d-flex justify-content-center"
             data-type="standard"
             data-shape="rectangular"
             data-theme="filled_black"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
        </div>
      </div>

      <div class="position-relative text-center my-4">
        <hr class="border-secondary">
        <span class="position-absolute top-50 start-50 translate-middle px-3 bg-dark text-muted small tech-font">OR DEV & MULTIPLAYER TESTING ACCESS</span>
      </div>

      <!-- Instant Multiplayer Dev/Demo Accounts -->
      <div class="d-grid gap-2 mb-3">
        <button class="btn btn-cyber-primary py-2 d-flex align-items-center justify-content-center" onclick="quickLogin('citizen_alpha@aetheria.universe', 'Citizen Alpha', 'player')">
          <i class="bi bi-person-fill me-2"></i> Enter as Citizen Alpha (Player 1)
        </button>
        <button class="btn btn-cyber-secondary py-2 d-flex align-items-center justify-content-center" onclick="quickLogin('citizen_beta@aetheria.universe', 'Citizen Beta', 'player')">
          <i class="bi bi-person-fill me-2"></i> Enter as Citizen Beta (Player 2)
        </button>
        <button class="btn btn-cyber-purple py-2 d-flex align-items-center justify-content-center" onclick="quickLogin('admin@aetheria.universe', 'Overseer Valen', 'admin')">
          <i class="bi bi-shield-lock-fill me-2"></i> Enter as Overseer Valen (Admin)
        </button>
      </div>

      <!-- Custom Demo Login Form -->
      <form id="custom-demo-form" onsubmit="handleCustomDemoLogin(event)" class="mt-4 pt-3 border-top border-secondary">
        <label class="form-label text-muted small tech-font text-uppercase">Custom Test Email</label>
        <div class="input-group">
          <input type="email" id="custom-email-input" class="form-control form-control-cyber" placeholder="pilot@universe.org" required>
          <button type="submit" class="btn btn-cyber-secondary">Connect</button>
        </div>
      </form>
    </div>

    <!-- Security Assurance Banner -->
    <div class="cyber-card p-3 text-center text-muted small">
      <i class="bi bi-shield-check text-success me-1"></i>
      Google OAuth 2.0 Verified · Password-free · Encrypted Session Cookies
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // Handle Google Sign-In Callback
    async function handleGoogleCredentialResponse(response) {
      try {
        const data = await apiFetch('/api/auth/google', {
          method: 'POST',
          body: { credential: response.credential }
        });
        showToast('Google identity authenticated successfully!', 'success');
        setTimeout(() => {
          window.location.href = data.redirect || (data.hasCharacter ? '/dashboard.html' : '/character-create.html');
        }, 600);
      } catch (err) {
        showToast('Google authentication failed: ' + err.message, 'danger');
      }
    }

    // Quick Dev / Demo Login Helper
    async function quickLogin(email, displayName, role) {
      try {
        const data = await apiFetch('/api/auth/demo-login', {
          method: 'POST',
          body: { email, displayName, role }
        });
        showToast(`Authenticated as ${displayName}!`, 'success');
        setTimeout(() => {
          window.location.href = data.redirect || (data.hasCharacter ? '/dashboard.html' : '/character-create.html');
        }, 500);
      } catch (err) {
        showToast('Authentication error: ' + err.message, 'danger');
      }
    }

    async function handleCustomDemoLogin(e) {
      e.preventDefault();
      const email = document.getElementById('custom-email-input').value.trim();
      if (!email) return;
      await quickLogin(email, email.split('@')[0], 'player');
    }
  </script>
</body>
</html>
