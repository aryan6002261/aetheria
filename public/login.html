<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entering Aethel...</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-4">

  <div class="text-center p-4" style="max-width: 440px;">
    <div class="text-primary fs-1 mb-3"><i class="bi bi-globe2"></i></div>
    <h3 class="fw-bold mb-2">Planet Aethel</h3>
    <p class="text-muted small mb-4">Connecting to simulation world...</p>
    <div class="spinner-border text-primary mb-3" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <div>
      <a href="/character-create.html" id="manual-link" class="btn btn-outline-primary btn-sm d-none">
        Click here if not redirected automatically
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await apiFetch('/api/auth/enter');
        window.location.href = res.redirect || '/character-create.html';
      } catch (err) {
        document.getElementById('manual-link').classList.remove('d-none');
        window.location.href = '/character-create.html';
      }
    });
  </script>
</body>
</html>
