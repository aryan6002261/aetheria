<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Planetary Wallet & Financial Ledger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 960px;">
    <!-- Wallet Summary Cards -->
    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="cyber-card p-4 h-100 text-center" style="background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, rgba(13,20,36,0.95) 70%);">
          <div class="tech-font text-muted text-uppercase small mb-1">Liquid Planetary Wallet</div>
          <div class="display-5 brand-font text-success fw-bold mb-2" id="wallet-balance">₡500.00</div>
          <div class="text-info tech-font small mb-4">Veridia Prime Clearings · Double-Entry Ledger</div>
          <button class="btn btn-cyber-primary btn-sm px-4" data-bs-toggle="modal" data-bs-target="#transferModal">
            <i class="bi bi-send-fill me-1"></i> Transfer Credits
          </button>
        </div>
      </div>

      <div class="col-md-6">
        <div class="cyber-card p-4 h-100 text-center" style="background: radial-gradient(circle, rgba(0,240,255,0.1) 0%, rgba(13,20,36,0.95) 70%);">
          <div class="tech-font text-muted text-uppercase small mb-1">Arcadia Central High-Yield Savings</div>
          <div class="display-5 brand-font text-info fw-bold mb-2" id="bank-balance">₡0.00</div>
          <div class="text-muted tech-font small mb-4">Account: <span id="bank-acc-num">ARC-BNK-XXXXX</span> · 3.5% APR</div>
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-cyber-secondary btn-sm" onclick="depositToBank()">
              <i class="bi bi-box-arrow-in-down me-1"></i> Deposit
            </button>
            <button class="btn btn-cyber-secondary btn-sm" onclick="withdrawFromBank()">
              <i class="bi bi-box-arrow-up me-1"></i> Withdraw
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Immutable Ledger Transactions -->
    <div class="cyber-card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="brand-font text-white fs-6 mb-0"><i class="bi bi-journal-code text-info me-2"></i>Audited Transaction Ledger</h5>
        <button class="btn btn-cyber-secondary btn-sm" onclick="loadWalletData()">
          <i class="bi bi-arrow-repeat me-1"></i> Sync
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0" style="background: transparent;">
          <thead class="border-secondary text-muted tech-font small text-uppercase">
            <tr>
              <th>ID / Type</th>
              <th>Description</th>
              <th>Counterparty</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody id="ledger-table-body">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">Synchronizing with ledger...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Transfer Modal -->
  <div class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content cyber-card border-secondary text-white">
        <div class="modal-header border-secondary py-3">
          <h5 class="modal-title brand-font fs-6">Transfer Credits to Citizen</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="transfer-form" onsubmit="handleTransferFunds(event)">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Recipient Citizen Handle</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-info">@</span>
                <input type="text" id="transfer-recipient" class="form-control form-control-cyber" placeholder="username" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Transfer Amount (₡)</label>
              <input type="number" id="transfer-amount" class="form-control form-control-cyber" placeholder="50.00" step="0.01" min="0.01" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Memo / Note</label>
              <input type="text" id="transfer-note" class="form-control form-control-cyber" placeholder="For cybernetic components">
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-cyber-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-cyber-primary btn-sm">Confirm Ledger Transfer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let myWallet = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('wallet');
      loadWalletData();
    });

    async function loadWalletData() {
      try {
        const walletData = await apiFetch('/api/economy/wallet');
        myWallet = walletData.wallet;
        document.getElementById('wallet-balance').innerText = formatCredits(myWallet.balance);

        const bankData = await apiFetch('/api/economy/bank');
        if (bankData.account) {
          document.getElementById('bank-balance').innerText = formatCredits(bankData.account.balance);
          document.getElementById('bank-acc-num').innerText = bankData.account.account_number;
        }

        renderLedger(walletData.transactions || []);
      } catch (err) {
        showToast('Failed to load wallet: ' + err.message, 'danger');
      }
    }

    function renderLedger(txs) {
      const tbody = document.getElementById('ledger-table-body');
      if (txs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No transactions recorded yet.</td></tr>';
        return;
      }

      tbody.innerHTML = txs.map(t => {
        const isDebit = myWallet && t.from_wallet_id === myWallet.id;
        const colorClass = isDebit ? 'text-danger' : 'text-success';
        const sign = isDebit ? '-' : '+';
        const counterparty = isDebit ? (t.to_character_name || 'System / Vendor') : (t.from_character_name || 'Treasury / Payout');

        return `
          <tr>
            <td>
              <span class="badge badge-neon-cyan tech-font text-uppercase">${t.transaction_type}</span>
            </td>
            <td class="text-white small">${t.description || 'Ledger transfer'}</td>
            <td class="text-muted small">${counterparty}</td>
            <td class="${colorClass} fw-bold tech-font fs-6">${sign}₡${parseFloat(t.amount).toFixed(2)}</td>
            <td><span class="badge badge-neon-emerald">COMPLETED</span></td>
            <td class="text-muted small tech-font">${new Date(t.created_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}</td>
          </tr>
        `;
      }).join('');
    }

    async function handleTransferFunds(e) {
      e.preventDefault();
      const recipientUsername = document.getElementById('transfer-recipient').value.trim();
      const amount = document.getElementById('transfer-amount').value;
      const description = document.getElementById('transfer-note').value.trim();

      try {
        const res = await apiFetch('/api/economy/transfer', {
          method: 'POST',
          body: { recipientUsername, amount, description }
        });
        showToast(res.message, 'success');
        bootstrap.Modal.getInstance(document.getElementById('transferModal')).hide();
        loadWalletData();
        renderCyberNavbar('wallet');
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function depositToBank() {
      const amount = prompt('Enter amount of Credits to deposit into savings:');
      if (!amount || isNaN(amount) || parseFloat(amount) <= 0) return;

      try {
        const res = await apiFetch('/api/economy/bank/deposit', {
          method: 'POST',
          body: { amount: parseFloat(amount) }
        });
        showToast(res.message, 'success');
        loadWalletData();
        renderCyberNavbar('wallet');
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function withdrawFromBank() {
      const amount = prompt('Enter amount of Credits to withdraw from savings:');
      if (!amount || isNaN(amount) || parseFloat(amount) <= 0) return;

      try {
        const res = await apiFetch('/api/economy/bank/withdraw', {
          method: 'POST',
          body: { amount: parseFloat(amount) }
        });
        showToast(res.message, 'success');
        loadWalletData();
        renderCyberNavbar('wallet');
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
