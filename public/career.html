<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Planetary Career Market</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 960px;">
    <!-- Active Career Status Terminal -->
    <div class="cyber-card p-4 mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="brand-font text-white fs-5 mb-0"><i class="bi bi-briefcase-fill text-info me-2"></i>Current Professional Appointment</h4>
        <span class="badge badge-neon-emerald">Active Contract</span>
      </div>

      <div id="current-employment-card">
        <div class="text-muted small text-center py-3">Scanning employment database...</div>
      </div>
    </div>

    <!-- Job Market Directory -->
    <h4 class="brand-font text-white fs-5 mb-3"><i class="bi bi-building-check text-info me-2"></i>Civilian Career Market</h4>
    <div class="row g-4" id="jobs-grid">
      <div class="col-12 text-center text-muted py-4">Loading open positions...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('career');
      loadCareerData();
    });

    async function loadCareerData() {
      try {
        const data = await apiFetch('/api/career/jobs');
        const emp = data.currentEmployment;
        const jobs = data.jobs || [];

        const empContainer = document.getElementById('current-employment-card');
        if (!emp) {
          empContainer.innerHTML = `
            <div class="text-center py-3 text-muted">
              You are currently registered as an Independent Civilian. Apply for a position below to earn regular shift payouts!
            </div>
          `;
        } else {
          empContainer.innerHTML = `
            <div class="row align-items-center">
              <div class="col-md-7">
                <div class="fs-4 text-white fw-bold brand-font mb-1">${emp.title}</div>
                <div class="text-info tech-font mb-2">DIVISION: ${emp.category} · SALARY: ₡${parseFloat(emp.salary).toFixed(2)} / SHIFT</div>
                <div class="d-flex align-items-center gap-2 mb-2">
                  <span class="small text-muted">Performance Rating:</span>
                  <div class="progress-cyber flex-grow-1" style="max-width: 250px;">
                    <div class="progress-bar-cyan h-100" style="width: ${emp.performance}%;"></div>
                  </div>
                  <span class="small text-white fw-bold">${emp.performance}/100</span>
                </div>
              </div>
              <div class="col-md-5 text-md-end mt-3 mt-md-0 d-flex flex-column gap-2">
                <button class="btn btn-cyber-primary py-2" onclick="performShift()">
                  <i class="bi bi-hammer me-1"></i> Work Shift (Collect Salary)
                </button>
                <button class="btn btn-cyber-secondary btn-sm" onclick="requestPromotion()">
                  <i class="bi bi-arrow-up-circle me-1"></i> Request Career Promotion
                </button>
              </div>
            </div>
          `;
        }

        const grid = document.getElementById('jobs-grid');
        grid.innerHTML = jobs.map(j => `
          <div class="col-md-6">
            <div class="cyber-card p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="badge badge-neon-cyan tech-font">${j.category}</span>
                  <span class="text-success tech-font fw-bold fs-6">₡${parseFloat(j.base_salary).toFixed(2)}</span>
                </div>
                <h5 class="brand-font text-white fs-6 mb-2">
                  <i class="bi ${j.icon || 'bi-briefcase'} text-info me-2"></i>${j.title}
                </h5>
                <p class="text-muted small mb-3">${j.description}</p>
                <div class="text-muted small mb-3">Min Skill Proficiency: <span class="text-white fw-bold">Level ${j.min_skill_level}</span></div>
              </div>
              <button class="btn btn-cyber-secondary btn-sm w-100" onclick="applyForJob(${j.id})">
                <i class="bi bi-file-earmark-check me-1"></i> Apply for Position
              </button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showToast('Failed to load career data: ' + err.message, 'danger');
      }
    }

    async function applyForJob(jobId) {
      try {
        const res = await apiFetch('/api/career/apply', {
          method: 'POST',
          body: { jobId }
        });
        showToast(res.message, 'success');
        loadCareerData();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function performShift() {
      try {
        const res = await apiFetch('/api/career/work', { method: 'POST' });
        showToast(res.message, 'success');
        loadCareerData();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function requestPromotion() {
      try {
        const res = await apiFetch('/api/career/promote', { method: 'POST' });
        showToast(res.message, 'success');
        loadCareerData();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
