<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Citizen Profile Bioscan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 960px;">
    <!-- Profile Card Header -->
    <div class="cyber-card p-4 p-md-5 mb-4 position-relative">
      <div class="row align-items-center">
        <div class="col-md-3 text-center mb-3 mb-md-0">
          <div class="rounded-3 p-2 border border-info mx-auto position-relative" style="width: 140px; height: 140px; background: #0b1329;">
            <img id="prof-avatar" src="/img/avatars/default.png" alt="Avatar" class="w-100 h-100" style="object-fit: cover;" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=AetheriaCitizen'">
            <span class="position-absolute bottom-0 start-50 translate-middle-x badge badge-neon-cyan px-2" id="prof-level-badge">LVL 1</span>
          </div>
        </div>

        <div class="col-md-9 text-center text-md-start">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-start gap-2 mb-1">
            <h2 class="brand-font text-white mb-0 fs-3" id="prof-name">Citizen Loading...</h2>
            <span class="badge badge-neon-emerald tech-font" id="prof-stage">Early Adulthood</span>
            <span class="badge badge-neon-purple tech-font" id="prof-rep"><i class="bi bi-star-fill me-1"></i>REP 100</span>
          </div>
          <div class="text-info tech-font mb-2" id="prof-handle">@citizen</div>
          <p class="text-muted small mb-3" id="prof-bio">Citizen record retrieving...</p>

          <div class="d-flex flex-wrap gap-3 text-muted small tech-font">
            <span><i class="bi bi-geo-alt text-info me-1"></i><strong class="text-white" id="prof-location">Aethel City, Neo-Arcadia</strong></span>
            <span><i class="bi bi-globe text-info me-1"></i><strong class="text-white" id="prof-planet">Veridia Prime</strong></span>
            <span><i class="bi bi-hourglass-split text-info me-1"></i>Age: <strong class="text-white" id="prof-age">19</strong></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Skills & Achievements Row -->
    <div class="row g-4 mb-4">
      <!-- Skills -->
      <div class="col-lg-6">
        <div class="cyber-card p-4 h-100">
          <h5 class="brand-font text-white fs-6 mb-3"><i class="bi bi-cpu text-info me-2"></i>Skill Proficiencies</h5>
          <div id="prof-skills-container">
            <div class="text-muted small text-center py-3">Scanning skill matrix...</div>
          </div>
        </div>
      </div>

      <!-- Achievements -->
      <div class="col-lg-6">
        <div class="cyber-card p-4 h-100">
          <h5 class="brand-font text-white fs-6 mb-3"><i class="bi bi-trophy-fill text-warning me-2"></i>Unlocked Achievements</h5>
          <div id="prof-achievements-container" class="row g-2">
            <div class="text-muted small text-center py-3">Reading achievement hall...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('profile');
      const urlParams = new URLSearchParams(window.location.search);
      let targetId = urlParams.get('id');

      if (!targetId) {
        const auth = await getCurrentUser();
        targetId = auth?.profile?.id || 1;
      }

      loadProfile(targetId);
    });

    async function loadProfile(identifier) {
      try {
        const data = await apiFetch(`/api/player/profile/${identifier}`);
        const p = data.profile;
        const skills = data.skills || [];
        const achievements = data.achievements || [];

        document.getElementById('prof-name').innerText = p.character_name;
        document.getElementById('prof-handle').innerText = '@' + p.username;
        document.getElementById('prof-bio').innerText = p.bio || 'Citizen of the Frontier.';
        document.getElementById('prof-age').innerText = p.virtual_age;
        document.getElementById('prof-stage').innerText = p.life_stage;
        document.getElementById('prof-level-badge').innerText = 'LVL ' + p.level;
        document.getElementById('prof-rep').innerHTML = `<i class="bi bi-star-fill me-1"></i>REP ${p.reputation}`;
        document.getElementById('prof-location').innerText = `${p.city_name || 'Aethel City'}, ${p.country_name || 'Neo-Arcadia'}`;
        document.getElementById('prof-planet').innerText = p.planet_name || 'Veridia Prime';

        if (p.sprite_url) {
          document.getElementById('prof-avatar').src = p.sprite_url;
        }

        // Render Skills
        const skillsContainer = document.getElementById('prof-skills-container');
        if (skills.length === 0) {
          skillsContainer.innerHTML = '<div class="text-muted small py-2">No specialized skills trained yet. Enroll in an academy!</div>';
        } else {
          skillsContainer.innerHTML = skills.map(s => `
            <div class="mb-3">
              <div class="d-flex justify-content-between small mb-1">
                <span class="text-white fw-bold">${s.name} (${s.category})</span>
                <span class="text-info tech-font">LVL ${s.level} · ${s.current_xp} XP</span>
              </div>
              <div class="progress-cyber">
                <div class="progress-bar-cyan h-100" style="width: ${Math.min(100, s.current_xp % 100)}%;"></div>
              </div>
            </div>
          `).join('');
        }

        // Render Achievements
        const achContainer = document.getElementById('prof-achievements-container');
        if (achievements.length === 0) {
          achContainer.innerHTML = '<div class="text-muted small py-2">No achievements recorded yet. Explore the universe!</div>';
        } else {
          achContainer.innerHTML = achievements.map(a => `
            <div class="col-6">
              <div class="p-2 rounded bg-dark border border-secondary text-center">
                <div class="text-warning fs-4 mb-1"><i class="bi ${a.icon || 'bi-trophy-fill'}"></i></div>
                <div class="fw-bold text-white small" style="font-size: 0.8rem;">${a.title}</div>
                <div class="text-muted" style="font-size: 0.7rem;">${a.description}</div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        showToast('Failed to load profile: ' + err.message, 'danger');
      }
    }
  </script>
</body>
</html>
