<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Planetary Missions & Quests</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 960px;">
    <!-- Title -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="brand-font text-white mb-1">Planetary Directives & Missions</h3>
        <p class="text-muted small mb-0">Participate in civilization milestones to earn Experience, Credits, and Reputation.</p>
      </div>
    </div>

    <!-- Missions List Container -->
    <div class="row g-4" id="missions-grid">
      <div class="col-12 text-center text-muted py-5">Scanning active directives...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('missions');
      loadMissions();
    });

    async function loadMissions() {
      try {
        const data = await apiFetch('/api/missions');
        const grid = document.getElementById('missions-grid');
        const missions = data.missions || [];

        if (missions.length === 0) {
          grid.innerHTML = '<div class="col-12 text-center text-muted py-5">No directives available right now.</div>';
          return;
        }

        grid.innerHTML = missions.map(m => {
          const isClaimed = m.status === 'claimed';
          const isReady = m.progress >= m.target && !isClaimed;
          const pct = Math.min(100, Math.round((m.progress / m.target) * 100));

          return `
            <div class="col-md-6">
              <div class="cyber-card p-4 h-100 d-flex flex-column justify-content-between">
                <div>
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge badge-neon-cyan tech-font">${m.category}</span>
                    <span class="text-success tech-font fw-bold">+₡${m.currency_reward} · +${m.xp_reward} XP</span>
                  </div>
                  <h5 class="brand-font text-white fs-6 mb-2">${m.title}</h5>
                  <p class="text-muted small mb-3">${m.description}</p>
                  
                  <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="progress-cyber flex-grow-1">
                      <div class="progress-bar-cyan h-100" style="width: ${pct}%;"></div>
                    </div>
                    <span class="text-muted small tech-font">${m.progress} / ${m.target}</span>
                  </div>
                </div>

                <div>
                  ${isClaimed ? `
                    <button class="btn btn-cyber-secondary btn-sm w-100 disabled" disabled>
                      <i class="bi bi-check-all me-1"></i> Reward Claimed
                    </button>
                  ` : isReady ? `
                    <button class="btn btn-cyber-primary btn-sm w-100" onclick="claimMissionReward(${m.mission_id})">
                      <i class="bi bi-gift-fill me-1"></i> Claim Directive Reward!
                    </button>
                  ` : `
                    <button class="btn btn-cyber-secondary btn-sm w-100 disabled" disabled>
                      Objective in Progress (${pct}%)
                    </button>
                  `}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        showToast('Failed to load missions: ' + err.message, 'danger');
      }
    }

    async function claimMissionReward(missionId) {
      try {
        const res = await apiFetch(`/api/missions/${missionId}/claim`, { method: 'POST' });
        showToast(res.message, 'success');
        loadMissions();
        renderCyberNavbar('missions'); // Refresh HUD balance
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
