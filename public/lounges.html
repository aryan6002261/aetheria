<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Cyber Lounges Directory</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 960px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="brand-font text-white mb-1">Planetary Cyber Lounges</h3>
        <p class="text-muted small mb-0">Immersive social hangouts across Veridia Prime. Join an open hub or establish a private enclave.</p>
      </div>
      <button class="btn btn-cyber-primary" data-bs-toggle="modal" data-bs-target="#createLoungeModal">
        <i class="bi bi-plus-lg me-1"></i> Create Lounge
      </button>
    </div>

    <div class="row g-4" id="lounges-grid">
      <div class="col-12 text-center py-5 text-muted tech-font">Scanning active planetary lounges...</div>
    </div>
  </div>

  <!-- Create Lounge Modal -->
  <div class="modal fade" id="createLoungeModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content cyber-card border-secondary text-white">
        <div class="modal-header border-secondary py-3">
          <h5 class="modal-title brand-font fs-6">Establish New Cyber Lounge</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="create-lounge-form" onsubmit="handleCreateLounge(event)">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Lounge Name</label>
              <input type="text" id="lounge-name" class="form-control form-control-cyber" placeholder="Neon Spire Speakeasy" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Category</label>
              <select id="lounge-category" class="form-select form-select-cyber">
                <option value="Cyber Lounge">Cyber Lounge</option>
                <option value="Science Hub">Science Hub</option>
                <option value="Traders Guild">Traders Guild</option>
                <option value="Art & Music Enclave">Art & Music Enclave</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small tech-font text-uppercase">Description</label>
              <textarea id="lounge-desc" class="form-control form-control-cyber" rows="2" placeholder="Atmospheric gathering spot for innovators..."></textarea>
            </div>
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="lounge-is-private" onchange="document.getElementById('lounge-pass-box').classList.toggle('d-none', !this.checked)">
              <label class="form-check-label text-muted small" for="lounge-is-private">Require Security Passcode (Private Lounge)</label>
            </div>
            <div class="mb-3 d-none" id="lounge-pass-box">
              <label class="form-label text-muted small tech-font text-uppercase">Access Passcode</label>
              <input type="password" id="lounge-pass" class="form-control form-control-cyber" placeholder="Secret passphrase">
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-cyber-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-cyber-primary btn-sm">Establish Lounge</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('lounges');
      loadLounges();
    });

    async function loadLounges() {
      try {
        const data = await apiFetch('/api/chat/lounges');
        const grid = document.getElementById('lounges-grid');
        if (!data.lounges || data.lounges.length === 0) {
          grid.innerHTML = '<div class="col-12 text-center text-muted py-5">No lounges discovered.</div>';
          return;
        }

        grid.innerHTML = data.lounges.map(l => `
          <div class="col-md-6">
            <div class="cyber-card p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="badge ${l.is_private ? 'badge-neon-amber' : 'badge-neon-cyan'} tech-font">
                    ${l.is_private ? '<i class="bi bi-lock-fill me-1"></i>PRIVATE' : '<i class="bi bi-unlock-fill me-1"></i>OPEN'}
                  </span>
                  <span class="text-muted small tech-font">${l.city_name || 'Aethel City'}</span>
                </div>
                <h4 class="brand-font text-white fs-5 mb-1">${l.name}</h4>
                <div class="text-info tech-font small mb-2">${l.category}</div>
                <p class="text-muted small mb-3">${l.description || 'Welcome to this hangout.'}</p>
              </div>

              <div class="border-top border-secondary pt-3 d-flex justify-content-between align-items-center">
                <span class="text-muted small">
                  <i class="bi bi-people text-info me-1"></i> ${l.current_occupants || 4} / ${l.capacity || 50} Citizens
                </span>
                <a href="/chat.html" class="btn btn-cyber-primary btn-sm">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Enter Lounge
                </a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showToast('Failed to load lounges: ' + err.message, 'danger');
      }
    }

    async function handleCreateLounge(e) {
      e.preventDefault();
      const name = document.getElementById('lounge-name').value.trim();
      const category = document.getElementById('lounge-category').value;
      const description = document.getElementById('lounge-desc').value.trim();
      const isPrivate = document.getElementById('lounge-is-private').checked;
      const passCode = document.getElementById('lounge-pass').value.trim();

      try {
        await apiFetch('/api/chat/lounges/create', {
          method: 'POST',
          body: { name, category, description, isPrivate, passCode }
        });
        showToast('Lounge created successfully!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('createLoungeModal')).hide();
        loadLounges();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
