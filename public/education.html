<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Academies of Higher Learning</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 960px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="brand-font text-white mb-1">Academies & Quantum Qualifications</h3>
        <p class="text-muted small mb-0">Advance your intellect, acquire technical proficiencies, and qualify for high-tier careers.</p>
      </div>
    </div>

    <!-- Active Enrollments Section -->
    <div class="cyber-card p-4 mb-4">
      <h5 class="brand-font text-white fs-6 mb-3"><i class="bi bi-mortarboard-fill text-info me-2"></i>Active Academic Enrollments</h5>
      <div id="active-enrollments-container">
        <div class="text-muted small text-center py-2">Loading active degrees...</div>
      </div>
    </div>

    <!-- Available Academies Grid -->
    <h4 class="brand-font text-white fs-5 mb-3"><i class="bi bi-building text-info me-2"></i>Institutions of Higher Education</h4>
    <div class="row g-4" id="academies-grid">
      <div class="col-12 text-center text-muted py-4">Scanning university network...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('education');
      loadEducationData();
    });

    async function loadEducationData() {
      try {
        const data = await apiFetch('/api/education/institutions');
        const enrollments = data.enrollments || [];
        const institutions = data.institutions || [];

        // Render Active Enrollments
        const enrollContainer = document.getElementById('active-enrollments-container');
        if (enrollments.length === 0) {
          enrollContainer.innerHTML = '<div class="text-muted small py-2">You are not currently enrolled in any programs. Select an academy below to begin!</div>';
        } else {
          enrollContainer.innerHTML = enrollments.map(e => `
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center p-3 mb-2 rounded-2" style="background: rgba(15,23,42,0.6); border: 1px solid var(--border-neon);">
              <div class="mb-2 mb-md-0">
                <div class="fw-bold text-white">${e.program_name}</div>
                <div class="text-info small">${e.institution_name} · Grade Average: <span class="fw-bold text-white">${e.grade_average}%</span></div>
              </div>
              <div class="d-flex gap-2">
                ${e.status === 'enrolled' ? `
                  <button class="btn btn-cyber-secondary btn-sm" onclick="studySession(${e.id})">
                    <i class="bi bi-book me-1"></i> Study (+25 XP)
                  </button>
                  <button class="btn btn-cyber-primary btn-sm" onclick="graduateProgram(${e.id})">
                    <i class="bi bi-award me-1"></i> Take Final Exam
                  </button>
                ` : `
                  <span class="badge badge-neon-emerald">GRADUATED WITH HONORS</span>
                `}
              </div>
            </div>
          `).join('');
        }

        // Render Academies Grid
        const grid = document.getElementById('academies-grid');
        grid.innerHTML = institutions.map(inst => `
          <div class="col-md-6 col-lg-4">
            <div class="cyber-card p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="badge badge-neon-cyan tech-font">${inst.type}</span>
                  <span class="text-warning small"><i class="bi bi-star-fill me-1"></i>${inst.reputation} Rep</span>
                </div>
                <h4 class="brand-font text-white fs-6 mb-2">${inst.name}</h4>
                <p class="text-muted small mb-3">${inst.description}</p>
                <div class="d-flex justify-content-between text-muted small mb-3">
                  <span>Tuition:</span>
                  <span class="text-success fw-bold">${parseFloat(inst.tuition_fee) === 0 ? 'FREE / PUBLIC' : '₡' + inst.tuition_fee}</span>
                </div>
              </div>
              <button class="btn btn-cyber-primary btn-sm w-100" onclick="enrollInAcademy(${inst.id}, '${inst.name}')">
                <i class="bi bi-journal-plus me-1"></i> Enroll in Academy
              </button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showToast('Failed to load education data: ' + err.message, 'danger');
      }
    }

    async function enrollInAcademy(instId, name) {
      try {
        const res = await apiFetch('/api/education/enroll', {
          method: 'POST',
          body: { institutionId: instId, programName: `Degree at ${name}` }
        });
        showToast(res.message, 'success');
        loadEducationData();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function studySession(enrollId) {
      try {
        const res = await apiFetch('/api/education/study', {
          method: 'POST',
          body: { enrollmentId: enrollId }
        });
        showToast(res.message, 'success');
        loadEducationData();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function graduateProgram(enrollId) {
      try {
        const res = await apiFetch('/api/education/graduate', {
          method: 'POST',
          body: { enrollmentId: enrollId }
        });
        showToast(res.message, 'success');
        loadEducationData();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
