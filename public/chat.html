<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Quantum Comms Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container-fluid px-lg-4 py-3">
    <div class="row g-3">
      <!-- Left Sidebar: Channels & Contacts -->
      <div class="col-lg-3">
        <div class="cyber-card p-3 h-100 d-flex flex-column" style="min-height: 650px;">
          <h5 class="text-white brand-font fs-6 mb-3"><i class="bi bi-broadcast text-info me-2"></i>Channels</h5>
          
          <div class="list-group list-group-flush mb-4" id="channels-list">
            <button class="list-group-item list-group-item-action bg-transparent border-0 text-white p-2 active rounded-2" onclick="switchChannel(1, 'Global Holo-Net')">
              <i class="bi bi-globe text-info me-2"></i> Global Holo-Net
            </button>
            <button class="list-group-item list-group-item-action bg-transparent border-0 text-white p-2 rounded-2" onclick="switchCityChannel('Aethel City')">
              <i class="bi bi-building text-info me-2"></i> Aethel City Comms
            </button>
            <button class="list-group-item list-group-item-action bg-transparent border-0 text-white p-2 rounded-2" onclick="switchCityChannel('Nova Haven')">
              <i class="bi bi-compass text-info me-2"></i> Nova Haven Spaceport
            </button>
          </div>

          <h5 class="text-white brand-font fs-6 mb-2"><i class="bi bi-people-fill text-purple me-2" style="color: var(--neon-purple);"></i>Direct Contacts</h5>
          <div class="list-group list-group-flush flex-grow-1 overflow-auto" id="direct-contacts-list">
            <!-- Populated via API -->
            <div class="text-muted small p-2">Loading contacts...</div>
          </div>
        </div>
      </div>

      <!-- Main Chat Area -->
      <div class="col-lg-9">
        <div class="chat-window">
          <!-- Chat Header -->
          <div class="p-3 border-bottom border-secondary d-flex justify-content-between align-items-center" style="background: rgba(10, 16, 32, 0.9);">
            <div>
              <h5 class="brand-font text-white fs-6 mb-0" id="current-chat-title">Global Holo-Net (Veridia Prime)</h5>
              <small class="tech-font text-info" id="chat-sub-status"><span class="pulse-beacon me-1"></span> Quantum Frequency Active</small>
            </div>
            <div class="text-muted small tech-font" id="typing-indicator"></div>
          </div>

          <!-- Message History -->
          <div class="chat-messages" id="chat-messages-container">
            <div class="text-center text-muted small py-4">Connecting to quantum channel...</div>
          </div>

          <!-- Composer Bar -->
          <div class="p-3 border-top border-secondary" style="background: rgba(6, 10, 20, 0.95);">
            <form id="chat-send-form" onsubmit="handleSendMessage(event)">
              <div class="input-group">
                <input type="text" id="chat-input" class="form-control form-control-cyber" placeholder="Transmit quantum message to channel..." required autocomplete="off" oninput="emitTyping()">
                <button type="submit" class="btn btn-cyber-primary px-4">
                  <i class="bi bi-send-fill me-1"></i> Send
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let activeConversationId = 1;
    let activeRoom = 'conv_1';
    let myProfile = null;
    let typingTimer = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('chat');
      const auth = await getCurrentUser();
      if (!auth?.hasCharacter) {
        window.location.href = auth ? '/character-create.html' : '/login.html';
        return;
      }
      myProfile = auth.profile;

      loadDirectContacts();
      loadConversationMessages(1);

      // Socket Listeners
      if (socket) {
        socket.emit('join_room', { room: activeRoom });

        socket.on('new_message', (msg) => {
          appendChatMessage(msg);
        });

        socket.on('user_typing', (data) => {
          const el = document.getElementById('typing-indicator');
          if (data.isTyping) {
            el.innerText = `${data.characterName} is typing...`;
          } else {
            el.innerText = '';
          }
        });
      }
    });

    async function loadDirectContacts() {
      try {
        const data = await apiFetch('/api/social/friends');
        const container = document.getElementById('direct-contacts-list');
        if (!data.friends || data.friends.length === 0) {
          container.innerHTML = '<div class="text-muted small p-2">No connected friends yet. Visit Social Net!</div>';
          return;
        }

        container.innerHTML = data.friends.map(f => `
          <button class="list-group-item list-group-item-action bg-transparent border-0 text-white p-2 d-flex align-items-center" onclick="openDirectMessage(${f.id}, '${f.character_name}')">
            <span class="pulse-beacon ${f.is_online ? 'bg-success' : 'bg-secondary'} me-2"></span>
            <div class="text-start" style="line-height: 1.2;">
              <div class="tech-font fw-bold" style="font-size: 0.85rem;">${f.character_name}</div>
              <div class="text-muted" style="font-size: 0.7rem;">@${f.username}</div>
            </div>
          </button>
        `).join('');
      } catch (err) {
        console.warn('Contacts load error:', err);
      }
    }

    async function loadConversationMessages(convId) {
      try {
        activeConversationId = convId;
        const data = await apiFetch(`/api/chat/messages/${convId}`);
        const container = document.getElementById('chat-messages-container');
        
        if (!data.messages || data.messages.length === 0) {
          container.innerHTML = '<div class="text-center text-muted small py-4">No transmissions recorded in this channel yet.</div>';
          return;
        }

        container.innerHTML = data.messages.map(renderChatBubble).join('');
        container.scrollTop = container.scrollHeight;
      } catch (err) {
        showToast('Failed to load message history: ' + err.message, 'danger');
      }
    }

    function renderChatBubble(msg) {
      const isMe = myProfile && msg.sender_profile_id === myProfile.id;
      const isSystem = msg.is_system;

      if (isSystem) {
        return `
          <div class="text-center my-2">
            <span class="badge bg-dark border border-secondary text-muted tech-font px-3 py-1" style="font-size: 0.75rem;">
              <i class="bi bi-shield-check me-1"></i>${msg.content}
            </span>
          </div>
        `;
      }

      return `
        <div class="d-flex flex-column ${isMe ? 'align-items-end' : 'align-items-start'} mb-2">
          <div class="tech-font text-muted small mb-1" style="font-size: 0.75rem;">
            ${msg.sender_name || 'Citizen'} · ${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
          </div>
          <div class="chat-bubble ${isMe ? 'chat-bubble-sent' : 'chat-bubble-received'}">
            ${escapeHtml(msg.content)}
          </div>
        </div>
      `;
    }

    function appendChatMessage(msg) {
      const container = document.getElementById('chat-messages-container');
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = renderChatBubble({
        ...msg,
        sender_profile_id: msg.senderProfileId,
        sender_name: msg.senderName,
        created_at: msg.createdAt
      });
      container.appendChild(tempDiv.firstChild);
      container.scrollTop = container.scrollHeight;
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content) return;

      if (socket) {
        socket.emit('send_message', {
          conversationId: activeConversationId,
          room: activeRoom,
          content
        });
        socket.emit('typing_stop', { room: activeRoom });
      }

      input.value = '';
    }

    function emitTyping() {
      if (!socket) return;
      socket.emit('typing_start', { room: activeRoom });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        socket.emit('typing_stop', { room: activeRoom });
      }, 2000);
    }

    function switchChannel(convId, title) {
      if (socket) socket.emit('leave_room', { room: activeRoom });
      activeRoom = `conv_${convId}`;
      if (socket) socket.emit('join_room', { room: activeRoom });
      document.getElementById('current-chat-title').innerText = title;
      loadConversationMessages(convId);
    }

    function switchCityChannel(cityName) {
      document.getElementById('current-chat-title').innerText = `${cityName} Comms Hub`;
      loadConversationMessages(1);
    }

    async function openDirectMessage(friendProfileId, friendName) {
      try {
        const data = await apiFetch(`/api/chat/direct/${friendProfileId}`, { method: 'POST' });
        switchChannel(data.conversationId, `Direct Comms: ${friendName}`);
      } catch (err) {
        showToast('Failed to open direct comms: ' + err.message, 'danger');
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
