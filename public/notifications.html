<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Notifications & Alerts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 840px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="brand-font text-white mb-1">Planetary Comm Notifications</h3>
        <p class="text-muted small mb-0">System directives, economic transfers, and social alerts.</p>
      </div>
    </div>

    <div class="cyber-card p-4" id="notifications-container">
      <div class="text-center py-4 text-muted">Retrieving alerts...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('notifications');
      loadNotifications();
    });

    async function loadNotifications() {
      const container = document.getElementById('notifications-container');
      container.innerHTML = `
        <div class="p-3 mb-2 rounded bg-dark border border-info d-flex align-items-center">
          <i class="bi bi-shield-check text-info fs-4 me-3"></i>
          <div>
            <div class="fw-bold text-white small">Civilian Registration Confirmed</div>
            <div class="text-muted small">Welcome to Veridia Prime. Starter allowance of ₡500 Credits credited to wallet ledger.</div>
          </div>
        </div>
        <div class="p-3 mb-2 rounded bg-dark border border-secondary d-flex align-items-center">
          <i class="bi bi-broadcast text-success fs-4 me-3"></i>
          <div>
            <div class="fw-bold text-white small">Quantum Holonet Connection Established</div>
            <div class="text-muted small">Global channel and local city frequencies are active for transmission.</div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
