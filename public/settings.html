<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Citizen Settings & Profile Tuning</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 760px;">
    <div class="cyber-card p-4 p-md-5 mb-4">
      <h4 class="brand-font text-white fs-5 mb-3"><i class="bi bi-gear-fill text-info me-2"></i>Citizen Terminal Settings</h4>
      
      <form id="settings-form" onsubmit="handleSaveSettings(event)">
        <div class="mb-3">
          <label class="form-label text-muted small tech-font text-uppercase">Citizen Biography</label>
          <textarea id="settings-bio" class="form-control form-control-cyber" rows="4"></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted small tech-font text-uppercase">Gender Presentation</label>
          <select id="settings-gender" class="form-select form-select-cyber">
            <option value="Non-binary">Non-binary</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Synthetic AI Identity">Synthetic AI Identity</option>
          </select>
        </div>

        <button type="submit" class="btn btn-cyber-primary py-2 px-4 mb-4">
          <i class="bi bi-check2 me-1"></i> Save Preferences
        </button>
      </form>

      <div class="border-top border-secondary pt-4">
        <h5 class="text-white brand-font fs-6 mb-2">Session Control</h5>
        <p class="text-muted small mb-3">Terminate active quantum connection across this device.</p>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> Disconnect & Log Out
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('settings');
      const auth = await getCurrentUser();
      if (auth?.profile) {
        document.getElementById('settings-bio').value = auth.profile.bio || '';
        document.getElementById('settings-gender').value = auth.profile.gender || 'Non-binary';
      }
    });

    async function handleSaveSettings(e) {
      e.preventDefault();
      const bio = document.getElementById('settings-bio').value.trim();
      const gender = document.getElementById('settings-gender').value;

      try {
        const res = await apiFetch('/api/player/profile', {
          method: 'PUT',
          body: { bio, gender }
        });
        showToast(res.message, 'success');
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
