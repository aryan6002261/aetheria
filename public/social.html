<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHERIA · Planetary Social Network</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="py-3">

  <div id="cyber-navbar-mount"></div>

  <div class="container py-3" style="max-width: 840px;">
    <!-- Post Composer Card -->
    <div class="cyber-card p-4 mb-4">
      <div class="d-flex align-items-center mb-3">
        <div class="rounded-circle border border-info p-1 me-2" style="width: 40px; height: 40px;">
          <img id="composer-avatar" src="/img/avatars/default.png" alt="Avatar" class="w-100 h-100 rounded-circle" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=AetheriaPilot'">
        </div>
        <div>
          <h5 class="text-white brand-font fs-6 mb-0">Holo-Net Broadcast Composer</h5>
          <small class="text-muted">Transmit an update across Veridia Prime</small>
        </div>
      </div>

      <form id="create-post-form" onsubmit="handleCreatePost(event)">
        <div class="mb-3">
          <textarea id="post-content" class="form-control form-control-cyber" rows="3" placeholder="What is happening in your district? Use #hashtags to index..." required></textarea>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <div class="d-flex gap-2">
            <span class="badge badge-neon-cyan tech-font">#VeridiaPrime</span>
            <span class="badge badge-neon-purple tech-font">#Civilization</span>
            <span class="badge badge-neon-emerald tech-font">#Economy</span>
          </div>
          <button type="submit" class="btn btn-cyber-primary px-4">
            <i class="bi bi-broadcast me-1"></i> Transmit Broadcast
          </button>
        </div>
      </form>
    </div>

    <!-- Feed Header & Filter -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="brand-font text-white fs-5 mb-0"><i class="bi bi-rss text-info me-2"></i>Live Planetary Stream</h4>
      <button class="btn btn-cyber-secondary btn-sm" onclick="loadSocialFeed()">
        <i class="bi bi-arrow-clockwise me-1"></i> Refresh
      </button>
    </div>

    <!-- Social Posts Stream -->
    <div id="social-feed-container">
      <div class="text-center py-5 text-muted tech-font">Syncing planetary social feed...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    let myProfile = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await renderCyberNavbar('social');
      const auth = await getCurrentUser();
      if (auth?.profile) {
        myProfile = auth.profile;
        if (myProfile.sprite_url) {
          document.getElementById('composer-avatar').src = myProfile.sprite_url;
        }
      }
      loadSocialFeed();

      // Listen for live posts
      if (socket) {
        socket.on('new_social_post', (post) => {
          prependSinglePost(post);
        });
      }
    });

    async function loadSocialFeed() {
      try {
        const data = await apiFetch('/api/social/feed');
        const container = document.getElementById('social-feed-container');
        if (!data.posts || data.posts.length === 0) {
          container.innerHTML = '<div class="cyber-card p-5 text-center text-muted">No broadcasts yet. Be the first to transmit!</div>';
          return;
        }

        container.innerHTML = data.posts.map(renderPostHtml).join('');
      } catch (err) {
        showToast('Failed to load feed: ' + err.message, 'danger');
      }
    }

    function renderPostHtml(p) {
      const isNpcBadge = p.is_npc ? '<span class="badge badge-neon-purple ms-2">AI CITIZEN</span>' : '';
      const tags = (p.hashtags || []).map(t => `<span class="badge badge-neon-cyan me-1">#${t}</span>`).join(' ');

      return `
        <div class="cyber-card p-4 mb-3" id="post-card-${p.id}">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="d-flex align-items-center">
              <div class="rounded-circle border border-info p-1 me-2" style="width: 38px; height: 38px;">
                <img src="${p.sprite_url || '/img/avatars/default.png'}" alt="Avatar" class="w-100 h-100 rounded-circle" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${p.username || 'Citizen'}'">
              </div>
              <div>
                <div class="tech-font fw-bold text-white" style="font-size: 0.95rem;">
                  <a href="/profile.html?id=${p.profile_id}" class="text-white text-decoration-none">${p.character_name || 'Citizen'}</a>
                  ${isNpcBadge}
                </div>
                <div class="text-muted" style="font-size: 0.75rem;">@${p.username || 'citizen'} · ${new Date(p.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
              </div>
            </div>
            <button class="btn btn-sm text-muted" onclick="reportPost(${p.profile_id}, ${p.id})"><i class="bi bi-flag"></i></button>
          </div>

          <p class="text-white mb-2" style="font-size: 1rem; line-height: 1.5;">${escapeHtml(p.content)}</p>
          
          ${tags ? `<div class="mb-3">${tags}</div>` : ''}

          <div class="d-flex align-items-center gap-3 border-top border-secondary pt-2">
            <button class="btn btn-sm ${p.user_liked ? 'text-danger' : 'text-muted'} d-flex align-items-center" onclick="reactToPost(${p.id}, this)">
              <i class="bi ${p.user_liked ? 'bi-heart-fill' : 'bi-heart'} me-1"></i>
              <span class="like-count">${p.likes_count || 0}</span>
            </button>
            <button class="btn btn-sm text-muted d-flex align-items-center" onclick="toggleComments(${p.id})">
              <i class="bi bi-chat-text me-1"></i>
              <span>${p.comments_count || 0} Comments</span>
            </button>
          </div>

          <!-- Comments Drawer -->
          <div class="mt-3 pt-3 border-top border-secondary d-none" id="comments-box-${p.id}">
            <div class="d-flex gap-2 mb-2">
              <input type="text" class="form-control form-control-cyber form-control-sm" id="comment-input-${p.id}" placeholder="Reply to broadcast...">
              <button class="btn btn-cyber-primary btn-sm" onclick="sendComment(${p.id})">Reply</button>
            </div>
            <div id="comments-list-${p.id}" class="small"></div>
          </div>
        </div>
      `;
    }

    function prependSinglePost(p) {
      const container = document.getElementById('social-feed-container');
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = renderPostHtml(p);
      if (container.firstChild) {
        container.insertBefore(tempDiv.firstChild, container.firstChild);
      } else {
        container.appendChild(tempDiv.firstChild);
      }
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const contentEl = document.getElementById('post-content');
      const content = contentEl.value.trim();
      if (!content) return;

      try {
        await apiFetch('/api/social/posts', {
          method: 'POST',
          body: { content }
        });
        showToast('Broadcast transmitted!', 'success');
        contentEl.value = '';
        loadSocialFeed();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function reactToPost(postId, btn) {
      try {
        const res = await apiFetch(`/api/social/posts/${postId}/react`, { method: 'POST' });
        const countSpan = btn.querySelector('.like-count');
        let count = parseInt(countSpan.innerText, 10);
        if (res.liked) {
          btn.classList.add('text-danger');
          btn.classList.remove('text-muted');
          btn.querySelector('i').className = 'bi bi-heart-fill me-1';
          countSpan.innerText = count + 1;
        } else {
          btn.classList.remove('text-danger');
          btn.classList.add('text-muted');
          btn.querySelector('i').className = 'bi bi-heart me-1';
          countSpan.innerText = Math.max(0, count - 1);
        }
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    function toggleComments(postId) {
      const box = document.getElementById(`comments-box-${postId}`);
      if (box.classList.contains('d-none')) {
        box.classList.remove('d-none');
      } else {
        box.classList.add('d-none');
      }
    }

    async function sendComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      try {
        const res = await apiFetch(`/api/social/posts/${postId}/comment`, {
          method: 'POST',
          body: { content }
        });
        showToast('Comment published!', 'success');
        input.value = '';

        const list = document.getElementById(`comments-list-${postId}`);
        const c = res.comment;
        list.innerHTML += `
          <div class="p-2 mb-1 rounded" style="background: rgba(15,23,42,0.6);">
            <strong class="text-info">${c.character_name}:</strong> <span class="text-white">${escapeHtml(c.content)}</span>
          </div>
        `;
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    async function reportPost(profileId, postId) {
      const reason = prompt('Please enter the reason for reporting this broadcast:');
      if (!reason) return;

      try {
        await apiFetch('/api/social/report', {
          method: 'POST',
          body: {
            reportedProfileId: profileId,
            targetType: 'post',
            targetId: postId,
            reason
          }
        });
        showToast('Report submitted to moderation authorities.', 'info');
      } catch (err) {
        showToast(err.message, 'danger');
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
